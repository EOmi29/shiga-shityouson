<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滋賀県 市町村をおぼえよう</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#eaf2ee;color:#263238;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 14px;background:#2e7d6b;color:#fff}
header h1{margin:0;font-size:1.15rem;letter-spacing:.04em}
#tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#tabs .sep{font-size:.78rem;opacity:.85;margin:0 2px 0 8px}
#tabs button{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;font-weight:700;
  background:#fff;color:#2e7d6b;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25)}
#tabs button.active{background:#ffd54f;color:#4e342e}
main{flex:1;min-height:0;display:flex;gap:12px;padding:10px 12px}
#panel{display:none;flex:none;width:300px;flex-direction:column;gap:8px;min-height:0;background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
body.training #panel{display:flex}
#panel h2{margin:0;font-size:1.05rem;color:#2e7d6b}
#panel p{margin:0;font-size:.85rem;line-height:1.5;color:#455a64}
.score{font-weight:700;font-size:1rem;color:#c62828}
.score small{color:#607d8b;font-weight:400;margin-left:8px}
#stage{position:relative;flex:1;min-width:0;min-height:0;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.15);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
/* ---- map styling ---- */
.region{cursor:pointer;transition:fill .15s}
.land{fill:#d9d9d9;stroke:none}
.lake{fill:#cfe8f7;stroke:none;fill-rule:evenodd}
.borders{fill:none;pointer-events:none;stroke-linejoin:round;stroke-linecap:butt}
#map.view .borders{stroke:#fff;stroke-width:2.2}
#map.blank .borders{stroke:#6b7270;stroke-width:1.4;stroke-dasharray:6 4}
#map.view .land:hover{fill:#c4d9cf}
#map.view .region.sel.land{fill:#ffe08a}
#map.view .region.sel.lake{fill:#9fd2ef}
#map.blank .land{fill:#e8ecea}
#map.blank .lake{fill:#fff}
#map.blank .land.ok{fill:#c8e6c9}
#map.blank .lake.ok{fill:#b3e5fc;stroke:#b3e5fc;stroke-width:3}
#map.blank .land.rev{fill:#ffcc80}
#map.blank .lake.rev{fill:#ffcc80}
#map.blank .region.target{animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{fill:#ffe082}50%{fill:#ffb300}}
#map.blank.mode-label-drag .region:hover{fill:#e3f2fd}
.lbl{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-weight:700;fill:#263238;
  paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.lbl.lk{fill:#1f6b94;stroke:#e6f4fb}
.lbl.rev{fill:#c62828}
.furi{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:#37474f;font-weight:600;
  paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.plate rect{fill:#fff;stroke:#2e7d6b;stroke-width:2;rx:6}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 1.15s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:scale(.3)}22%{opacity:1;transform:scale(1.18)}55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#floatG,#markG,#labelG{pointer-events:none}
/* ---- info card (view mode) ---- */
#info{position:absolute;left:0;top:0;display:none;max-width:230px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 5px rgba(0,0,0,.25)}
body.mode-view #info{display:block}
#info .nm{font-size:1.6rem;font-weight:800;color:#2e7d6b;min-height:1.2em}
#info .rd{font-size:.95rem;color:#607d8b;min-height:1.3em}
#info label{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.85rem;cursor:pointer}
#info .hint{font-size:.78rem;color:#78909c;margin-top:4px}
/* ---- tray ---- */
.tray{touch-action:pan-y;flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start;padding:2px}
.chip{border:2px solid #b0bec5;border-radius:12px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 4px;cursor:grab;touch-action:none;-webkit-touch-callout:none}
.chip svg{width:84px;height:84px;display:block;pointer-events:none}
.chip span{font-weight:700;font-size:.9rem;pointer-events:none}
.chip.name{padding:12px 4px;font-weight:800;font-size:1.05rem}
.chip.sel{border-color:#ff9800;background:#fff3e0}
.chip.lifted{opacity:.35}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%);background:#fff;border:2px solid #ff9800;
  border-radius:12px;padding:8px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 10px rgba(0,0,0,.3)}
/* ---- type mode ---- */
.typebox{display:flex;flex-direction:column;gap:10px}
.typebox input{width:100%;font:inherit;font-size:1.3rem;padding:10px 12px;border:2px solid #90a4ae;border-radius:10px;user-select:text;-webkit-user-select:text}
.typebox input:focus{outline:none;border-color:#2e7d6b}
.typebox input.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:#e0e7e4;color:#37474f}
.btn.main{background:#2e7d6b;color:#fff;flex:1}
#fb{min-height:1.5em;font-weight:700}
#fb.ok{color:#2e7d32}#fb.ng{color:#c62828}
/* ---- done overlay ---- */
#done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);z-index:5}
#done.show{display:flex}
#done .card{background:#fff;border-radius:18px;padding:22px 28px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.3);max-width:90%}
#done h2{margin:0 0 6px;font-size:1.6rem;color:#e53935}
#done p{margin:0 0 14px;color:#455a64}
#done .btns{justify-content:center}
@media (max-width:860px){
  header h1{font-size:1rem}
  #tabs button{padding:6px 10px;font-size:.82rem}
  main{flex-direction:column;padding:6px 8px;gap:8px}
  #panel{width:auto;height:200px;padding:8px 10px}
  #panel p{display:none}
  .tray{display:flex;overflow-x:auto;overflow-y:hidden;align-items:stretch}
  .chip{flex:none;width:92px;touch-action:none}
  .tray{touch-action:pan-x}
  .chip.name{width:auto;min-width:96px}
  .chip svg{width:64px;height:64px}
  #info{max-width:170px;padding:6px 10px}
  #info .nm{font-size:1.2rem}
  body.mode-type #panel{height:auto}
}
#dragLayer{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:900;overflow:visible}
ruby rt{font-size:.58em;font-weight:500;color:#546e7a;letter-spacing:0}
.segm{display:flex;border:2px solid #2e7d6b;border-radius:10px;overflow:hidden}
.segm button{flex:1;border:0;padding:8px 4px;font:inherit;font-size:.82rem;font-weight:700;background:#fff;color:#2e7d6b;cursor:pointer;white-space:nowrap}
.segm button.on{background:#2e7d6b;color:#fff}
#hint{font-size:1.6rem;font-weight:800;color:#2e7d6b;letter-spacing:.06em;min-height:1.4em}
#hint .bx{display:inline-block;width:1.15em;height:1.15em;border:2.5px solid #2e7d6b;border-radius:5px;vertical-align:-.22em;margin-right:.1em;background:#fff}
#hint small{font-size:.8rem;font-weight:600;color:#607d8b;letter-spacing:0}
</style>
</head>

  <h1>🗾 滋賀県 市町村をおぼえよう</h1>

</main>

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const G={lake:lakeG,land:landG,border:borderG,fixed:fixedG,label:labelG,mark:markG,float:floatG};
const panel=document.getElementById('panel');
const byId={};DATA.forEach(d=>byId[d.id]=d);
const PAL=['#ffcdd2','#f8bbd0','#e1bee7','#d1c4e9','#ffe0b2','#ffccbc','#ffecb3','#fff9c4','#f0f4c3','#dcedc8','#c8e6c9','#c5e1a5','#d7ccc8','#f48fb1','#ffab91','#ce93d8','#fff59d','#a5d6a7','#ffcc80'];
const LAKE_COLOR='#7fd0f5';
const colorOf=it=>it.lake?LAKE_COLOR:PAL[DATA.indexOf(it)%PAL.length];
const ruby=it=>`<ruby>${it.name}<rt>${it.read}</rt></ruby>`;
const TOTAL=DATA.length;

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toMap(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function scale(){return svg.getScreenCTM().a}
function center(it){return{x:(it.bb[0]+it.bb[2])/2,y:(it.bb[1]+it.bb[3])/2}}
function popR(it){return Math.max(26,Math.min(it.r*1.1,80))}

/* ---------- build base map ---------- */
el('path',{d:BORDER,class:'borders'},G.border);
const regionEl={};
DATA.forEach(it=>{
  const p=el('path',{d:it.d,class:'region '+(it.lake?'lake':'land'),'data-id':it.id},it.lake?G.lake:G.land);
  regionEl[it.id]=p;
});

function furiSize(fs){return fs<=18?11:Math.max(fs*0.62,15)}
function labelG_(it,opts={}){
  const g=el('g',{class:'lblg','data-id':it.id});
  const fs=opts.size||it.fs,fsz=furiSize(fs),fy=it.ly-fs*0.95;
  if(opts.plate){
    const w=Math.max(it.name.length*fs*1.02,it.read.length*fsz*0.98)+14;
    const top=fy-fsz*0.8,bot=it.ly+fs*0.75;
    const pg=el('g',{class:'plate'},g);
    el('rect',{x:it.lx-w/2,y:top,width:w,height:bot-top},pg);
  }
  const t=el('text',{x:it.lx,y:it.ly,class:'lbl'+(it.lake?' lk':'')+(opts.cls?' '+opts.cls:''),'font-size':fs},g);
  t.textContent=it.name;
  const f=el('text',{x:it.lx,y:fy,class:'furi','font-size':fsz},g);f.textContent=it.read;
  if(opts.plate){t.style.stroke='none';f.style.stroke='none'}
  return g;
}
function addLabel(it,opts){const g=labelG_(it,opts);G.label.appendChild(g);return g}
function clearDyn(){['fixed','label','mark','float'].forEach(k=>G[k].innerHTML='');
  Object.values(regionEl).forEach(r=>r.setAttribute('class',r.getAttribute('class').replace(/\s(ok|rev|sel|target)/g,'')));}

function pop(x,y,ok,R){
  const o=el('g',{transform:`translate(${x},${y})`},G.mark);
  const g=el('g',{class:'pop'},o);
  if(ok){el('circle',{r:R,fill:'none',stroke:'#e53935','stroke-width':R*0.22},g)}
  else{const a=R*0.7;el('path',{d:`M${-a} ${-a}L${a} ${a}M${a} ${-a}L${-a} ${a}`,stroke:'#37474f','stroke-width':R*0.26,'stroke-linecap':'round',fill:'none'},g)}
  setTimeout(()=>o.remove(),1250);
}
function addCls(r,c){r.setAttribute('class',r.getAttribute('class')+' '+c)}
function rmCls(r,c){r.setAttribute('class',r.getAttribute('class').split(' ').filter(x=>x!==c).join(' '))}

/* ---------- shared state ---------- */
const S={mode:'view',done:new Set(),miss:0,right:0,sel:null};
const doneEl=document.getElementById('done');
function updScore(){const e=document.getElementById('score');if(e)e.innerHTML=`○ ${S.done.size} / ${TOTAL}<small>まちがい ${S.miss}回</small>`}
function finish(){
  document.getElementById('doneTitle').textContent=S.mode==='type'?'ぜんぶ おわった！':'ぜんぶ できた！';
  document.getElementById('doneMsg').textContent=S.mode==='type'
    ?`せいかい ${S.right} / ${TOTAL}　（まちがい ${S.miss}回）`
    :`${TOTAL}こ ぜんぶ せいかい！　（まちがい ${S.miss}回）`;
  setTimeout(()=>doneEl.classList.add('show'),900);
}
document.getElementById('againBtn').onclick=()=>setMode(S.mode);
document.getElementById('toViewBtn').onclick=()=>setMode('view');

/* ---------- mode switching ---------- */
const modes={};
function setMode(m){
  if(modes[S.mode]&&modes[S.mode].end)modes[S.mode].end();
  S.mode=m;S.done=new Set();S.miss=0;S.right=0;S.sel=null;
  doneEl.classList.remove('show');
  document.body.className='mode-'+m+(m!=='view'?' training':'');
  svg.setAttribute('class',m==='view'?'view':'blank');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  clearDyn();panel.innerHTML='';
  modes[m].start();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
svg.addEventListener('click',e=>{
  const r=e.target.closest&&e.target.closest('.region');if(!r)return;
  const m=modes[S.mode];if(m.onRegion)m.onRegion(byId[r.dataset.id],e);
});

/* ---- chip gesture: decide drag vs. tray-scroll ONCE at the start, never cancel afterwards ---- */
function bindChip(c,hd){
  let st=null;
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('pointerdown',e=>{
    if(st)return;
    st={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,mode:e.pointerType==='mouse'?'drag':'wait'};
    try{c.setPointerCapture(e.pointerId)}catch(_){}
    if(st.mode==='drag'){e.preventDefault();hd.start(e,false)}
  });
  c.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    if(st.mode==='wait'){
      const dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(Math.hypot(dx,dy)<8)return;
      const horiz=matchMedia('(max-width:860px)').matches;   // portrait layout: tray scrolls sideways
      const along=horiz?Math.abs(dx)>1.5*Math.abs(dy):Math.abs(dy)>1.5*Math.abs(dx);
      if(along){st.mode='scroll'}else{st.mode='drag';hd.start(e,true);return}
    }
    if(st.mode==='scroll'){
      const tray=c.parentElement;
      tray.scrollTop-=e.clientY-st.ly;tray.scrollLeft-=e.clientX-st.lx;
      st.lx=e.clientX;st.ly=e.clientY;
    }else if(st.mode==='drag')hd.move(e);
  });
  const finish=(e,cancel)=>{
    if(!st||e.pointerId!==st.id)return;
    const m=st.mode;st=null;
    if(m==='drag'){cancel?hd.cancel():hd.end(e)}
    else if(m==='wait'&&!cancel)hd.tap();
  };
  c.addEventListener('pointerup',e=>finish(e,false));
  c.addEventListener('pointercancel',e=>finish(e,true));
}

/* ================= ① view ================= */
modes.view={
  start(){
    DATA.forEach(it=>addLabel(it));
    this.show(null);
  },
  show(it){
    document.getElementById('infoNm').textContent=it?it.name:'タップしてね';
    document.getElementById('infoRd').textContent=it?it.read:'市町村をタップすると名前が出ます';
  },
  onRegion(it){
    Object.values(regionEl).forEach(r=>rmCls(r,'sel'));
    addCls(regionEl[it.id],'sel');this.show(it);
  }
};

/* ================= ② puzzle ================= */
let pz=null;
function makePiece(it,float){
  const g=el('g',{});
  el('path',{d:it.d,fill:colorOf(it),'fill-opacity':float?0.72:1,stroke:'#37474f','stroke-width':float?2.6:2,'stroke-linejoin':'round','fill-rule':it.lake?'evenodd':'nonzero'},g);
  const fs=float?Math.max(it.fs,15/scale()):it.fs;
  const t=el('text',{x:it.lx,y:it.ly,class:'lbl'+(it.lake?' lk':''),'font-size':fs},g);t.textContent=it.name;
  const f=el('text',{x:it.lx,y:it.ly-fs*0.95,class:'furi','font-size':furiSize(fs)},g);f.textContent=it.read;
  return g;
}
function thumb(it){
  const pad=10,[x0,y0,x1,y1]=it.bb;
  return `<svg viewBox="${(x0-pad).toFixed(1)} ${(y0-pad).toFixed(1)} ${(x1-x0+2*pad).toFixed(1)} ${(y1-y0+2*pad).toFixed(1)}"><path d="${it.d}" fill="${colorOf(it)}" stroke="#37474f" stroke-width="${Math.max(2,(x1-x0)/60)}" fill-rule="${it.lake?'evenodd':'nonzero'}"/></svg>`;
}
modes.puzzle={
  start(){
    panel.innerHTML=`<h2>② パズルモード</h2><p>名前つきのピースを、白地図の正しい場所までドラッグして重ねよう。</p><div class="score" id="score"></div><div class="tray" id="tray"></div>`;
    const tray=document.getElementById('tray');
    shuffle(DATA).forEach(it=>{
      const c=h('div','chip',thumb(it)+`<span>${ruby(it)}</span>`);c.dataset.id=it.id;
      bindChip(c,{start:e=>this.down(it,c,e),move:e=>this.move(e),end:e=>this.up(e),cancel:()=>this.cancel(),tap:()=>{}});
      tray.appendChild(c);
    });
    updScore();
  },
  end(){this.cancel()},
  down(it,c,e){
    if(S.done.has(it.id))return;
    if(pz)this.cancel();
    e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    const s=scale(),small=Math.max(it.bb[2]-it.bb[0],it.bb[3]-it.bb[1])*s<80;
    pz={it,c,g:makePiece(it,true),off:(e.pointerType==='touch'&&small)?-70:0,sx:e.clientX,sy:e.clientY};
    document.getElementById('dragLayer').appendChild(pz.g);
    c.classList.add('lifted');this.move(e);
  },
  move(e){
    if(!pz)return;
    const s=scale(),ct=center(pz.it);
    pz.sx=e.clientX;pz.sy=e.clientY+pz.off;
    pz.g.setAttribute('transform',`translate(${pz.sx-ct.x*s},${pz.sy-ct.y*s}) scale(${s})`);
  },
  cancel(){if(!pz)return;pz.g.remove();pz.c.classList.remove('lifted');pz=null},
  up(e){
    if(!pz)return;this.move(e);
    const {it,c,sx,sy}=pz,ct=center(it),q=toMap(sx,sy);
    this.cancel();
    const r=svg.getBoundingClientRect();
    if(sx<r.left||sx>r.right||sy<r.top||sy>r.bottom)return;
    const w=it.bb[2]-it.bb[0],hh=it.bb[3]-it.bb[1];
    const tol=Math.max(18,Math.min(0.2*Math.max(w,hh),55));
    if(Math.hypot(q.x-ct.x,q.y-ct.y)<=tol){
      S.done.add(it.id);
      G.fixed.appendChild(makePiece(it,false));
      c.remove();
      pop(it.lx,it.ly,true,popR(it));
      updScore();
      if(S.done.size===TOTAL)finish();
    }else{
      S.miss++;pop(q.x,q.y,false,34);updScore();
    }
  }
};

/* ================= ③ label (名札はり) ================= */
let lb=null;
modes.label={
  start(){
    panel.innerHTML=`<h2>③ 名札はりモード</h2><p>名前をドラッグして、地図の正しい場所にのせよう。（名前をタップ → 地図をタップ、でもOK）</p><div class="score" id="score"></div><div class="tray" id="tray"></div>`;
    svg.classList.add('mode-label-drag');
    const tray=document.getElementById('tray');
    shuffle(DATA).forEach(it=>{
      const c=h('div','chip name',ruby(it));c.dataset.id=it.id;
      bindChip(c,{start:(e,f)=>this.down(it,c,e,f),move:e=>this.move(e),end:e=>this.up(e),cancel:()=>this.cancel(),tap:()=>this.toggleSel(it,c)});
      tray.appendChild(c);
    });
    updScore();
  },
  end(){this.cancel();svg.classList.remove('mode-label-drag')},
  chipOf(id){return document.querySelector('#tray .chip[data-id="'+id+'"]')},
  toggleSel(it,c){
    document.querySelectorAll('#tray .chip.sel').forEach(x=>x.classList.remove('sel'));
    if(S.sel===it){S.sel=null}else{S.sel=it;c.classList.add('sel')}
  },
  down(it,c,e,forced){
    if(S.done.has(it.id))return;
    if(lb)this.cancel();
    e.preventDefault();
    const ghost=h('div','ghost',ruby(it));document.body.appendChild(ghost);
    lb={it,c,ghost,sx:e.clientX,sy:e.clientY,moved:!!forced,off:e.pointerType==='touch'?-56:0};
    this.move(e);
  },
  move(e){
    if(!lb)return;
    lb.gx=e.clientX;lb.gy=e.clientY+lb.off;
    if(Math.hypot(e.clientX-lb.sx,e.clientY-lb.sy)>8)lb.moved=true;
    lb.ghost.style.left=lb.gx+'px';lb.ghost.style.top=lb.gy+'px';
    lb.ghost.style.display=lb.moved?'block':'none';
  },
  cancel(){if(!lb)return;lb.ghost.remove();lb=null},
  up(e){
    if(!lb)return;this.move(e);
    const {it,c,moved,gx,gy}=lb;this.cancel();
    if(!moved){this.toggleSel(it,c);return}
    const r=svg.getBoundingClientRect();
    if(gx<r.left||gx>r.right||gy<r.top||gy>r.bottom)return;
    const t=document.elementFromPoint(gx,gy),reg=t&&t.closest&&t.closest('.region');
    if(!reg)return;
    this.judge(it,byId[reg.dataset.id],gx,gy);
  },
  judge(it,target,cx,cy){
    if(it.id===target.id){
      S.done.add(it.id);S.sel=null;
      const ch=this.chipOf(it.id);if(ch)ch.remove();
      addCls(regionEl[it.id],'ok');
      addLabel(it,{plate:true});
      pop(it.lx,it.ly,true,popR(it));
      updScore();
      if(S.done.size===TOTAL)finish();
    }else{
      S.miss++;const p=toMap(cx,cy);pop(p.x,p.y,false,34);updScore();
    }
  },
  onRegion(target,e){
    if(!S.sel)return;
    const it=S.sel;
    const ch=this.chipOf(it.id);if(ch)ch.classList.remove('sel');
    S.sel=null;
    this.judge(it,target,e.clientX,e.clientY);
  }
};

/* ================= ④ type (ヒントなし) ================= */
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>toHira(s.normalize('NFKC').replace(/\s+/g,'')).replace(/龍/g,'竜');
const suffixOf=it=>it.lake?'':it.name.slice(-1);
const stemOf=it=>it.lake?it.name:it.name.slice(0,-1);
const readStem=it=>it.lake?it.read:it.read.replace(/(ちょう|し)$/,'');
function accepts(it){
  if(it.lake)return{kanji:['琵琶湖','琵琶','びわ湖'].map(norm),kana:['びわこ','びわ'].map(norm)};
  return{kanji:[stemOf(it),it.name].map(norm),kana:[readStem(it),it.read].map(norm)};
}
let tyKana=false;
try{tyKana=localStorage.getItem('shigaKana')==='1'}catch(_){}
const ty={};
modes.type={
  start(){
    panel.innerHTML=`<h2>④ ヒントなしモード</h2>
    <p>光っている場所の名前を入力しよう。わかる場所から答えたいときは、その場所をタップしてから入力できます。</p>
    <div class="score" id="score"></div>
    <div class="segm" id="judge"><button data-k="0">漢字で○</button><button data-k="1">ひらがなでも○</button></div>
    <div class="typebox"><div id="hint"></div>
    <input id="ans" type="text" placeholder="名前を入力" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <div id="fb"></div>
    <div class="btns"><button class="btn main" id="okBtn">こたえる</button><button class="btn" id="skipBtn">とばす</button><button class="btn" id="showBtn">こたえをみる</button></div></div>`;
    ty.order=shuffle(DATA);ty.i=-1;ty.cur=null;
    const setJ=k=>{tyKana=k==='1';try{localStorage.setItem('shigaKana',tyKana?'1':'0')}catch(_){}
      document.querySelectorAll('#judge button').forEach(b=>b.classList.toggle('on',b.dataset.k===(tyKana?'1':'0')))};
    document.querySelectorAll('#judge button').forEach(b=>b.onclick=()=>{setJ(b.dataset.k);document.getElementById('ans').focus()});
    setJ(tyKana?'1':'0');
    const inp=document.getElementById('ans');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();this.check()}});
    document.getElementById('okBtn').onclick=()=>this.check();
    document.getElementById('skipBtn').onclick=()=>this.next();
    document.getElementById('showBtn').onclick=()=>this.reveal();
    updScore();this.next(true);
  },
  end(){clearTimeout(ty.t)},
  setHint(it){
    const hint=document.getElementById('hint');
    hint.innerHTML=it?(it.lake?'<small>ヒント：みずうみ（ぜんぶ入力）</small>':`<span class="bx"></span>${suffixOf(it)}`):'';
  },
  setCur(it,noFocus){
    if(ty.cur)rmCls(regionEl[ty.cur.id],'target');
    ty.cur=it;addCls(regionEl[it.id],'target');this.setHint(it);
    const inp=document.getElementById('ans'),fb=document.getElementById('fb');
    inp.value='';fb.textContent='';fb.className='';
    if(!noFocus)inp.focus();
  },
  next(first){
    clearTimeout(ty.t);
    for(let k=0;k<TOTAL;k++){
      ty.i=(ty.i+1)%TOTAL;
      if(!S.done.has(ty.order[ty.i].id)){this.setCur(ty.order[ty.i],first);return}
    }
    ty.cur=null;this.setHint(null);finish();
  },
  onRegion(it){if(!S.done.has(it.id)){clearTimeout(ty.t);this.setCur(it)}},
  lock(it){S.done.add(it.id);rmCls(regionEl[it.id],'target');updScore()},
  check(){
    if(!ty.cur)return;
    const inp=document.getElementById('ans'),fb=document.getElementById('fb'),v=norm(inp.value);
    if(!v)return;
    const it=ty.cur,a=accepts(it);
    const good=a.kanji.includes(v)||(tyKana&&a.kana.includes(v));
    if(good){
      clearTimeout(ty.t);
      S.right++;this.lock(it);addCls(regionEl[it.id],'ok');addLabel(it,{plate:true});
      pop(it.lx,it.ly,true,popR(it));
      fb.textContent='せいかい！ '+it.name;fb.className='ok';
      ty.cur=null;this.setHint(null);
      ty.t=setTimeout(()=>this.next(),1000);
    }else if(a.kana.includes(v)){
      fb.textContent='漢字で書いてね（いまは「漢字で○」）';fb.className='ng';
      inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();
    }else{
      S.miss++;updScore();pop(it.lx,it.ly,false,34);
      fb.textContent='ちがうよ。もういちど！';fb.className='ng';
      inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');
      inp.select();
    }
  },
  reveal(){
    if(!ty.cur)return;
    const it=ty.cur,fb=document.getElementById('fb');
    clearTimeout(ty.t);
    this.lock(it);addCls(regionEl[it.id],'rev');addLabel(it,{cls:'rev'});
    fb.textContent='こたえ： '+it.name+'（'+it.read+'）';fb.className='ng';
    ty.cur=null;this.setHint(null);
    ty.t=setTimeout(()=>this.next(),1800);
  }
};

setMode('view');
</script>
